substitutions:
  # Voice phase IDs (matching ai_voice.h constants)
  voice_phase_idle: '1'
  voice_phase_recording: '3'
  voice_phase_thinking: '4'
  voice_phase_speaking: '5'
  voice_phase_not_ready: '10'
  voice_phase_error: '11'

esphome:
  name: ai-v
  friendly_name: AI-V
  name_add_mac_suffix: true
  min_version: 2026.3.0
  on_boot:
    priority: 375
    then:
      - script.execute: control_leds
      - delay: 1s
      - switch.turn_on: internal_speaker_amp
      # No HA connection needed, mark init done once WiFi connects
      - wait_until:
          wifi.connected:
      - lambda: id(init_in_progress) = false;
      - script.execute: control_leds

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

logger:
  level: DEBUG
  logs:
    sensor: WARN

api:

ota:
  - platform: esphome

# Web server for remote testing/control
web_server:
  port: 80

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 400kHz

psram:
  mode: octal
  speed: 80MHz

http_request:
  buffer_size_rx: 2048

# ============================================================================
# Globals
# ============================================================================
globals:
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: dial_touched
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: jack_plugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: jack_unplugged_recently
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: button_press_time
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: mute_animation_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'

# ============================================================================
# Switches
# ============================================================================
switch:
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute
    entity_category: config
    lambda: |-
      if (id(hardware_mute_switch).state || id(i2s_mics).get_mute_state()) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.mute:
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: hardware_mute_switch
          then:
            - microphone.unmute:
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

  - platform: gpio
    pin: GPIO47
    id: internal_speaker_amp
    name: "Internal speaker amp"
    entity_category: config
    restore_mode: ALWAYS_OFF
    internal: true

# ============================================================================
# Binary Sensors
# ============================================================================
binary_sensor:
  # Center Button: Hold 2s+ to record, double-tap to cycle provider
  - platform: gpio
    id: center_button
    pin:
      number: GPIO0
      inverted: true
    on_press:
      - lambda: id(button_press_time) = millis();
      - if:
          condition:
            switch.is_off: master_mute_switch
          then:
            - ai_voice.start_recording: ai_assistant
            - script.execute: control_leds
    on_release:
      - if:
          condition:
            lambda: return (millis() - id(button_press_time)) >= 2000;
          then:
            - ai_voice.stop_recording: ai_assistant
            - script.execute: control_leds
          else:
            - ai_voice.abort: ai_assistant
            - script.execute: control_leds
    on_multi_click:
      # Double tap: cycle provider
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.5s
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - ai_voice.abort: ai_assistant
          - ai_voice.cycle_provider: ai_assistant
          - script.execute: show_provider_color

  # Hardware mute switch
  - platform: gpio
    id: hardware_mute_switch
    internal: true
    pin: GPIO3
    on_press:
      - microphone.mute:
      - script.execute: show_muted
    on_release:
      - microphone.unmute:
      - script.execute: show_unmuted

  # Audio Jack
  - platform: gpio
    id: jack_plugged
    filters:
      - delayed_on: 200ms
      - delayed_off: 200ms
    pin:
      number: GPIO17
    on_press:
      - lambda: id(jack_plugged_recently) = true;
      - script.execute: control_leds
      - delay: 800ms
      - lambda: id(jack_plugged_recently) = false;
      - script.execute: control_leds
    on_release:
      - lambda: id(jack_unplugged_recently) = true;
      - script.execute: control_leds
      - delay: 800ms
      - lambda: id(jack_unplugged_recently) = false;
      - script.execute: control_leds

# ============================================================================
# LED Ring
# ============================================================================
light:
  - platform: esp32_rmt_led_strip
    id: leds_internal
    pin: GPIO21
    chipset: WS2812
    max_refresh_rate: 15ms
    num_leds: 12
    rgb_order: GRB
    rmt_symbols: 192
    default_transition_length: 0ms
    power_supply: led_power

  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6
    effects:
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 11) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 10) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 5) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 4) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(global_led_animation_index) = (id(global_led_animation_index) + 1) % 12;
      - addressable_lambda:
          name: "Thinking"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == id(global_led_animation_index) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
              } else {
                it[i] = Color::BLACK;
              }
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_lambda:
          name: "Replying"
          update_interval: 50ms
          lambda: |-
            id(global_led_animation_index) = (12 + id(global_led_animation_index) - 1) % 12;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            for (uint8_t i = 0; i < 12; i++) {
              if (i == (id(global_led_animation_index)) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 1) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 2) % 12) {
                it[i] = color * 128;
              } else if (i == (id(global_led_animation_index) + 6) % 12) {
                it[i] = color;
              } else if (i == (id(global_led_animation_index) + 7) % 12) {
                it[i] = color * 192;
              } else if (i == (id(global_led_animation_index) + 8) % 12) {
                it[i] = color * 128;
              } else {
                it[i] = Color::BLACK;
              }
            }
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 16ms
          lambda: |-
            float vol = id(media_player_out).volume;
            float filled = 12.0f * vol;
            // Gradient from teal to bright cyan
            for (uint8_t i = 0; i < 12; i++) {
              uint8_t idx = (6 + i) % 12;
              float fi = (float)i;
              if (fi < filled - 1.0f) {
                // Fully lit: gradient from deep teal to bright cyan based on position
                float t = fi / 11.0f;
                uint8_t r = (uint8_t)(t * 40);
                uint8_t g = (uint8_t)(100 + t * 155);
                uint8_t b = (uint8_t)(150 + t * 105);
                it[idx] = Color(r, g, b);
              } else if (fi < filled) {
                // Partial LED (smooth edge)
                float frac = filled - fi;
                float t = fi / 11.0f;
                uint8_t r = (uint8_t)(t * 40 * frac);
                uint8_t g = (uint8_t)((100 + t * 155) * frac);
                uint8_t b = (uint8_t)((150 + t * 105) * frac);
                it[idx] = Color(r, g, b);
              } else {
                it[idx] = Color(2, 2, 5);  // very dim, not fully black
              }
            }
            if (vol == 0.0f) {
              for (uint8_t i = 0; i < 12; i++) it[i] = Color::BLACK;
              it[6] = Color(255, 0, 0);  // red dot at zero
            }
      - addressable_lambda:
          name: "Red Pulse"
          update_interval: 10ms
          lambda: |-
            static uint8_t step = 0;
            static bool decreasing = true;
            if (initial_run) { step = 0; decreasing = true; }
            Color red(255, 0, 0);
            uint8_t b = (uint8_t)(255 - (255 * step / 10));
            for (uint8_t i = 0; i < 12; i++) { it[i] = red * b; }
            if (decreasing) step++; else step--;
            if (step == 0 || step == 10) decreasing = !decreasing;
      - addressable_lambda:
          name: "Green Pulse"
          update_interval: 10ms
          lambda: |-
            static uint8_t step = 0;
            static bool decreasing = true;
            if (initial_run) { step = 0; decreasing = true; }
            Color green(0, 255, 0);
            uint8_t b = (uint8_t)(255 - (255 * step / 10));
            for (uint8_t i = 0; i < 12; i++) { it[i] = green * b; }
            if (decreasing) step++; else step--;
            if (step == 0 || step == 10) decreasing = !decreasing;
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t brightness_step = 0;
            static bool brightness_decreasing = true;
            static uint8_t brightness_step_number = 10;
            if (initial_run) {
              brightness_step = 0;
              brightness_decreasing = true;
            }
            Color error_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = error_color * uint8_t(255/brightness_step_number*(brightness_step_number-brightness_step));
            }
            if (brightness_decreasing) {
              brightness_step++;
            } else {
              brightness_step--;
            }
            if (brightness_step == 0 || brightness_step == brightness_step_number) {
              brightness_decreasing = !brightness_decreasing;
            }
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 50%
      - addressable_lambda:
          name: "Voice kit startup failed"
          lambda: |-
            Color fail_color(255, 0, 0);
            for (uint8_t i = 0; i < 12; i++) {
              if (i % 3) {
                it[i] = Color::BLACK;
              } else {
                it[i] = fail_color;
              }
            }
      - addressable_lambda:
          name: "Jack Plugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) index = 0;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            if (index <= 6) {
              for (uint8_t i = 0; i < 12; i++) {
                if (i == index || i == (12 - index) % 12) {
                  it[i] = color;
                } else {
                  it[i] = Color::BLACK;
                }
              }
            }
            index++;
      - addressable_lambda:
          name: "Jack Unplugged"
          update_interval: 40ms
          lambda: |-
            static uint8_t index = 0;
            if (initial_run) index = 0;
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            if (index <= 6) {
              for (uint8_t i = 0; i < 12; i++) {
                if (i == 6 - index || i == (6 + index) % 12) {
                  it[i] = color;
                } else {
                  it[i] = Color::BLACK;
                }
              }
            }
            index++;
      - addressable_lambda:
          name: "Gentle Pulse Blue"
          update_interval: 16ms
          lambda: |-
            static float phase = 0;
            phase += 0.03f;
            if (phase > 6.28318f) phase -= 6.28318f;
            float pulse = 0.5f + 0.5f * sinf(phase);
            uint8_t b = (uint8_t)(100 + 155 * pulse);
            uint8_t g = (uint8_t)(30 + 50 * pulse);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = Color(0, g, b);
            }
      - addressable_rainbow:
          name: "Rainbow"
          width: 12
      - addressable_lambda:
          name: "Factory Reset Coming Up"
          update_interval: 1s
          lambda: |-
            static uint8_t index = 0;
            Color color(255, 0, 0);
            if (initial_run) index = 0;
            for (uint8_t i = 0; i < 12; i++) {
              if (i <= index) {
                it[i] = color;
              } else {
                it[i] = Color::BLACK;
              }
            }
            index = (index + 1) % 12;

  # User-facing LED ring
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 7
        to: 11
      - id: leds_internal
        from: 0
        to: 6

power_supply:
  - id: led_power
    pin: GPIO45

# ============================================================================
# Rotary Encoder (Volume)
# ============================================================================
sensor:
  - platform: rotary_encoder
    id: dial
    pin_a: GPIO16
    pin_b: GPIO18
    resolution: 2
    on_clockwise:
      - lambda: id(dial_touched) = true;
      - media_player.volume_up:
          id: media_player_out
      - script.execute: control_leds
      - script.execute: dial_timeout
    on_anticlockwise:
      - lambda: id(dial_touched) = true;
      - media_player.volume_down:
          id: media_player_out
      - script.execute: control_leds
      - script.execute: dial_timeout

# ============================================================================
# Phase change monitor (pipeline runs on Core 1, LEDs on main loop)
# ============================================================================
interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: return id(ai_assistant).phase_changed();
          then:
            - script.execute: control_leds
            - component.update: ai_status
            - component.update: last_transcript
            - component.update: last_error

# ============================================================================
# LED Control Script
# ============================================================================
script:
  - id: control_leds
    then:
      - lambda: |
          if (id(voice_kit_component).is_failed()) {
            id(control_leds_error).execute();
            return;
          }
          if (id(init_in_progress)) {
            id(control_leds_init).execute();
          } else if (!wifi::global_wifi_component->is_connected()) {
            id(control_leds_no_connection).execute();
          } else if (id(jack_plugged_recently)) {
            id(control_leds_jack_plugged).execute();
          } else if (id(jack_unplugged_recently)) {
            id(control_leds_jack_unplugged).execute();
          } else if (id(dial_touched)) {
            id(control_leds_volume).execute();
          } else if (id(ai_assistant).get_voice_phase() == ${voice_phase_recording}) {
            id(control_leds_recording).execute();
          } else if (id(ai_assistant).get_voice_phase() == ${voice_phase_thinking}) {
            id(control_leds_thinking).execute();
          } else if (id(ai_assistant).get_voice_phase() == ${voice_phase_speaking}) {
            id(control_leds_speaking).execute();
          } else if (id(ai_assistant).get_voice_phase() == ${voice_phase_error}) {
            id(control_leds_error).execute();
          } else if (id(master_mute_switch).state) {
            id(control_leds_muted).execute();
          } else {
            id(control_leds_idle).execute();
          }

  - id: control_leds_init
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                brightness: 66%
                red: 9.4%
                green: 73.3%
                blue: 94.9%
                id: voice_assistant_leds
                effect: "Twinkle"
          else:
            - light.turn_on:
                brightness: 66%
                red: 100%
                green: 89%
                blue: 71%
                id: voice_assistant_leds
                effect: "none"

  - id: control_leds_no_connection
    then:
      - light.turn_on:
          brightness: 66%
          red: 1
          green: 0
          blue: 0
          id: voice_assistant_leds
          effect: "Twinkle"

  - id: control_leds_idle
    then:
      - if:
          condition:
            and:
              - light.is_on: voice_assistant_leds
              - lambda: return !id(mute_animation_active);
          then:
            - light.turn_off: voice_assistant_leds

  - id: control_leds_recording
    then:
      - light.turn_on:
          brightness: 80%
          id: voice_assistant_leds
          effect: "Gentle Pulse Blue"

  - id: control_leds_thinking
    then:
      - light.turn_on:
          brightness: 100%
          id: voice_assistant_leds
          effect: "Rainbow"

  - id: control_leds_speaking
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Replying"

  - id: control_leds_volume
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Volume Display"

  - id: show_muted
    mode: restart
    then:
      - lambda: id(mute_animation_active) = true;
      - light.turn_on:
          brightness: 80%
          id: voice_assistant_leds
          effect: "Red Pulse"
      - delay: 3s
      - light.turn_off: voice_assistant_leds
      - lambda: id(mute_animation_active) = false;

  - id: show_unmuted
    mode: restart
    then:
      - script.stop: show_muted
      - lambda: id(mute_animation_active) = true;
      - light.turn_on:
          brightness: 80%
          id: voice_assistant_leds
          effect: "Green Pulse"
      - delay: 3s
      - light.turn_off: voice_assistant_leds
      - lambda: id(mute_animation_active) = false;

  - id: control_leds_muted
    then:
      - script.execute: show_muted

  - id: control_leds_error
    then:
      - light.turn_on:
          brightness: 40%
          id: voice_assistant_leds
          effect: "Error"

  - id: show_provider_color
    mode: restart
    then:
      - lambda: id(mute_animation_active) = true;
      - lambda: |-
          // Provider colors: Kimi=cyan, Claude=orange, DeepSeek=blue, MiniMax=green
          int idx = id(ai_assistant).get_provider_index();
          auto call = id(voice_assistant_leds).make_call();
          call.set_state(true);
          call.set_brightness(1.0f);
          switch(idx) {
            case 0: call.set_rgb(0.0f, 0.9f, 1.0f); break;  // Kimi: cyan
            case 1: call.set_rgb(1.0f, 0.5f, 0.0f); break;  // Claude: orange
            case 2: call.set_rgb(0.0f, 0.4f, 1.0f); break;  // DeepSeek: blue
            case 3: call.set_rgb(0.0f, 1.0f, 0.3f); break;  // MiniMax: green
            default: call.set_rgb(1.0f, 1.0f, 1.0f); break;
          }
          call.set_effect("none");
          call.perform();
      - delay: 1500ms
      - light.turn_off: voice_assistant_leds
      - lambda: id(mute_animation_active) = false;

  - id: dial_timeout
    mode: restart
    then:
      - delay: 2s
      - lambda: id(dial_touched) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute: control_leds

  - id: control_leds_jack_plugged
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Jack Plugged"

  - id: control_leds_jack_unplugged
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Jack Unplugged"

# ============================================================================
# I2S Audio
# ============================================================================
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
    i2s_bclk_pin:
      number: GPIO8

  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO14
    i2s_bclk_pin:
      number: GPIO13

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  # Hardware speaker
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO10
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3204_dac

  # Mixer: combines TTS output with any future audio sources
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: tts_mixing_input
        timeout: never
      - id: effects_mixing_input
        timeout: never

  # Resamplers
  - platform: resampler
    id: tts_resampling_speaker
    output_speaker: tts_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

# ============================================================================
# Audio Files
# ============================================================================
audio_file:
  - id: center_button_press_sound
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/center_button_press.flac

# ============================================================================
# Media Player (required for audio pipeline management)
# ============================================================================
media_source:
  - platform: audio_file
    id: audio_file_source
  - platform: http_request
    id: http_audio_source
    buffer_size: 250000

media_player:
  - platform: speaker_source
    id: media_player_out
    name: Media Player
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: tts_resampling_speaker
      sources:
        - audio_file_source
        - http_audio_source
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85

# ============================================================================
# Audio DAC + XMOS Voice Kit
# ============================================================================
audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c

voice_kit:
  id: voice_kit_component
  i2c_id: internal_i2c
  reset_pin: GPIO4
  firmware:
    url: https://github.com/esphome/voice-kit-xmos-firmware/releases/download/v1.3.1/ffva_v1.3.1_upgrade.bin
    version: "1.3.1"
    md5: 964635c5bf125529dab14a2472a15401

# ============================================================================
# External Components
# ============================================================================
external_components:
  # Voice Kit driver from official repo
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: dev
    components:
      - voice_kit
    refresh: 0s
  # http_request media source (from PR, needed for URL playback)
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: ff8ce89556748509d7ee8724e12d9d43d3c8c1e8
    refresh: 0s
    components: [http_request]
  # Our custom AI Voice component (local)
  - source:
      type: local
      path: esphome/components

# ============================================================================
# AI Voice Component
# ============================================================================
ai_voice:
  id: ai_assistant
  microphone: i2s_mics
  speaker: tts_resampling_speaker
  media_player: media_player_out

  # LLM Providers (cycle with short press)
  providers:
    - name: "Claude"
      endpoint: "https://api.anthropic.com/v1/messages"
      api_key: !secret claude_api_key
      model: "claude-sonnet-4-6"
      format: "anthropic"
    - name: "Kimi"
      endpoint: "https://api.kimi.com/coding/v1/chat/completions"
      api_key: !secret kimi_api_key
      model: "kimi-for-coding"
      format: "openai"
    - name: "DeepSeek"
      endpoint: "https://api.deepseek.com/chat/completions"
      api_key: !secret deepseek_api_key
      model: "deepseek-reasoner"
      format: "openai"
    - name: "MiniMax"
      endpoint: "https://api.minimax.io/anthropic/v1/messages"
      api_key: !secret minimax_api_key
      model: "MiniMax-M2.7-highspeed"
      format: "anthropic"

  system_prompt: "You are a concise voice assistant. Keep responses under 3 sentences."
  max_tokens: 256

  # STT
  stt_endpoint: "https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  stt_api_key: !secret dashscope_api_key
  stt_model: "qwen3-asr-flash-2026-02-10"

  # TTS
  tts_endpoint: "https://dashscope-intl.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  tts_api_key: !secret dashscope_api_key
  tts_model: "qwen3-tts-flash"
  tts_voice: "Jennifer"

  conversation_turns: 5
  web_search: true

# ============================================================================
# Buttons
# ============================================================================
button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    icon: "mdi:restart"

  # Hardware test: LED ring cycle
  - platform: template
    name: "Test LEDs"
    id: test_leds_button
    icon: "mdi:led-on"
    on_press:
      - logger.log: "=== TEST: LED Ring ==="
      - light.turn_on:
          id: voice_assistant_leds
          brightness: 100%
          red: 100%
          green: 0%
          blue: 0%
          effect: "none"
      - delay: 1s
      - light.turn_on:
          id: voice_assistant_leds
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1s
      - light.turn_on:
          id: voice_assistant_leds
          red: 0%
          green: 0%
          blue: 100%
      - delay: 1s
      - light.turn_on:
          id: voice_assistant_leds
          effect: "Rainbow"
      - delay: 3s
      - light.turn_off: voice_assistant_leds
      - logger.log: "=== TEST: LED Ring DONE ==="

  # Hardware test: Speaker via media_player
  - platform: template
    name: "Test Speaker"
    id: test_speaker_button
    icon: "mdi:speaker"
    on_press:
      - logger.log: "=== TEST: Speaker ==="
      - switch.turn_on: internal_speaker_amp
      - delay: 500ms
      - lambda: |-
          id(media_player_out)
            ->make_call()
            .set_media_url("audio-file://center_button_press_sound")
            .set_announcement(true)
            .perform();
      - delay: 3s
      - logger.log: "=== TEST: Speaker DONE ==="

  # Hardware test: Speaker via direct TTS URL
  - platform: template
    name: "Test TTS URL"
    id: test_tts_url_button
    icon: "mdi:text-to-speech"
    on_press:
      - logger.log: "=== TEST: TTS URL Playback ==="
      - switch.turn_on: internal_speaker_amp
      - delay: 500ms
      - lambda: |-
          // Plays the built-in sound via media player call
          auto call = id(media_player_out)->make_call();
          call.set_volume(0.85f);
          call.perform();
      - delay: 200ms
      - lambda: |-
          id(media_player_out)
            ->make_call()
            .set_media_url("audio-file://center_button_press_sound")
            .set_announcement(true)
            .perform();
      - delay: 3s
      - logger.log: "=== TEST: TTS URL DONE ==="

  # Hardware test: Microphone (record 2 seconds, log stats)
  - platform: template
    name: "Test Mic"
    id: test_mic_button
    icon: "mdi:microphone"
    on_press:
      - logger.log: "=== TEST: Microphone (recording 2s) ==="
      - lambda: |-
          id(ai_assistant).start_recording();
      - delay: 2s
      - lambda: |-
          id(ai_assistant).stop_recording();
      - logger.log: "=== TEST: Mic DONE (check pipeline logs) ==="

  # Hardware test: Full pipeline (STT -> LLM -> TTS)
  - platform: template
    name: "Test Full Pipeline"
    id: test_pipeline_button
    icon: "mdi:robot"
    on_press:
      - logger.log: "=== TEST: Full Pipeline (record 3s) ==="
      - lambda: id(ai_assistant).start_recording();
      - delay: 3s
      - lambda: id(ai_assistant).stop_recording();

  # Hardware test: XMOS voice kit status
  - platform: template
    name: "Test XMOS"
    id: test_xmos_button
    icon: "mdi:chip"
    on_press:
      - logger.log: "=== TEST: XMOS Voice Kit ==="
      - lambda: |-
          if (id(voice_kit_component).is_failed()) {
            ESP_LOGE("test", "XMOS: FAILED");
          } else {
            ESP_LOGI("test", "XMOS: OK");
          }

  # Hardware test: WiFi + API connectivity
  - platform: template
    name: "Test Network"
    id: test_network_button
    icon: "mdi:wifi"
    on_press:
      - logger.log: "=== TEST: Network ==="
      - lambda: |-
          if (wifi::global_wifi_component->is_connected()) {
            ESP_LOGI("test", "WiFi: CONNECTED");
          } else {
            ESP_LOGE("test", "WiFi: DISCONNECTED");
          }

# ============================================================================
# Text Sensors (for web UI visibility)
# ============================================================================
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"
  - platform: template
    name: "Provider"
    id: provider_name
    update_interval: never
    lambda: return id(ai_assistant).get_provider_name();
  - platform: template
    name: "Last Transcript"
    id: last_transcript
    update_interval: never
    lambda: return id(ai_assistant).get_last_transcript();
  - platform: template
    name: "Last Error"
    id: last_error
    update_interval: never
    lambda: return id(ai_assistant).get_last_error();
  - platform: template
    name: "AI Status"
    id: ai_status
    update_interval: never
    lambda: |-
      int phase = id(ai_assistant).get_voice_phase();
      switch(phase) {
        case 1: return std::string("idle");
        case 2: return std::string("stt");
        case 3: return std::string("recording");
        case 4: return std::string("thinking");
        case 5: return std::string("speaking");
        case 10: return std::string("not_ready");
        case 11: return std::string("error");
        default: return std::string("unknown");
      }
